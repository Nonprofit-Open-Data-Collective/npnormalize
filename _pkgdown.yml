url: https://nonprofit-open-data-collective.github.io/npnormalize/
destination: docs

# The NODC site style (colours, fonts, navbar, light/dark switch) comes from
# the pkgstyle template package. Do not add bslib settings or
# pkgdown/extra.css here unless this site needs to differ.
template:
  package: pkgstyle

home:
  title: "npnormalize: normalize nonprofit names and addresses"

navbar:
  structure:
    left: [intro, reference, news]

reference:
  - title: Normalize records
    desc: >
      Turn names and addresses into keys that can be matched.
    contents:
      - np_normalize
      - np_name_core
  - title: Statistics over the keys
    desc: >
      Count how common names, tokens and addresses are, for weighting and
      blocking.
    contents:
      - np_name_freq
      - np_token_idf
      - np_addr_freq
  - title: The signature
    desc: >
      Fingerprint the normalizer so stored keys can refuse to load under a
      different one.
    contents:
      - np_normalize_signature
  - title: Building blocks
    desc: >
      Tokenizers, stopwords and the rule tables the keys are built from.
    contents:
      - np_tokenize
      - np_stopwords
      - np_name_rules
  - title: Package
    contents:
      - npnormalize-package
